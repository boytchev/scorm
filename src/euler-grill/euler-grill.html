<!DOCTYPE html>
<html lang="en">

<head>
	<title>Euler Grill</title>

	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
	
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500&display=swap" rel="stylesheet">
	<link rel="shortcut icon" type="image/png" href="images/logo.png"/>
	
	<link rel="stylesheet" href="styles.css">



	<script src="libs/tween.umd.js"></script>
	<script src="libs/suica.js"></script>
	<script src="../scorm.utils.js"></script>
	<script src="box.js"></script>
	<script src="spinner.js"></script>
	<script src="base.js"></script>
	<script src="slider.js"></script>
	<script src="button.js"></script>
	<script src="playground.js"></script>
</head>

<body>
	<suica fullwindow background="linen" ontime="update" onpointermove="onPointerMove" onpointerdown="onPointerDown" onpointerup="onPointerUp"> 
		<orbit id="orb" distance="15" altitude="0" maxPolarAngle="1.57" maxDistance="25" minDistance="5" enablePan="true">
		<div class="hud corner top left"></div>
		<div class="hud corner top right"></div>
		<div class="hud corner bottom left"></div>
		<div class="hud corner bottom right"></div>

		<div class="hud top right" style="border: none;">
			<div id="timer" class="value">00:00:00</div>
			<div id="txt-time" class="label right">TIME</div>
		</div>
		
		<div id="points" class="hud value" style="opacity:0; transform-origin: right bottom; font-weight: bold;">+20</div>
		<div class="hud bottom right" style="border: none;">
			<div id="txt-score" class="label right">SCORE</div>
			<div id="score" class="value">0.0</div>
		</div>
		
		<div class="hud bottom left" style="border: none;">
			<div id="txt-performance" class="label right">PERFORMANCE</div>
			<canvas id="performance" class="label left perf" width="241" height="81"></canvas>
		</div>
		
		<div class="hud top left" style="border: none;">
			<div id="txt-caption" class="caption left">SCORM-TEMPLATE</div>
			<img id="sound-on-off" class="button left" src="images/sound-off.png"/>
		</div>
		
		<div id="txt-user" class="hud bottom footnote">GUEST</div>
	</suica>

	
	<script>
		var playground = new Playground;


		window.addEventListener( 'resize', playground.resize );
				
		function onPointerMove( event )
		{
			//playground.pointerMovement += Math.abs( event.movementX ) + Math.abs( event.movementY );
			
			if( playground.slider.inDrag )
			{
				playground.slider.slideTo( playground.dragX( event ) );
			}
			else
			{
				if( !playground.inVR )
				{
					if( findObject( event ) )
						event.target.style.cursor = 'pointer';
					else
						event.target.style.cursor = 'default';
				}
			}
		}
		
		function onPointerDown( event )
		{
			/*if( playground )
			{
				playground.pointerMovement = 0;
			}*/
			if( playground ) playground.pointerDownTime = Date.now();
		}		
		
		function onPointerUp( )
		{
			if( playground ) 
			{
				if( playground.slider.inDrag )
				{
					playground.slider.inDrag = false;
					playground.slider.slideEnd( );
				}
				orb.enableRotate = true;
			}
		}		
	</script>
	
<script>
// ---------- after you have created scene, camera, renderer ----------

const DEBUG = {
  canvas: null,
  ctx: null,
  texture: null,
  mesh: null,
  lines: [],
  maxLines: 18
};

function createDebugConsole(scene, options = {}) {
  const width = options.width || 1024;
  const height = options.height || 512;
  const worldWidth = options.worldWidth || 1.6;
  const worldHeight = options.worldHeight || 0.8;

  DEBUG.canvas = document.createElement('canvas');
  DEBUG.canvas.width = width;
  DEBUG.canvas.height = height;
  DEBUG.ctx = DEBUG.canvas.getContext('2d');

  DEBUG.texture = new THREE.CanvasTexture(DEBUG.canvas);
  DEBUG.texture.colorSpace = THREE.SRGBColorSpace;   // important for recent Three

  const material = new THREE.MeshBasicMaterial({
    map: DEBUG.texture,
    transparent: true,
    depthTest: false,          // always on top
    side: THREE.DoubleSide
  });

  DEBUG.mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(worldWidth, worldHeight),
    material
  );

  // place it in front of the user (adjust as needed)
  DEBUG.mesh.position.set(0, 1.4, -1.3);
  suica.scene.add(DEBUG.mesh);

  // optional: make it follow the camera
  // camera.add(DEBUG.mesh);
  // DEBUG.mesh.position.set(0, 0, -1.3);

  return DEBUG.mesh;
}

function debugLog(...args) {
  if (!DEBUG.ctx) return;

  const msg = args.map(a => {
    if (a === null) return 'null';
    if (a === undefined) return 'undefined';
    if (typeof a === 'object') {
      try { return JSON.stringify(a); } catch { return '[object]'; }
    }
    return String(a);
  }).join(' ');

  DEBUG.lines.push(msg);
  if (DEBUG.lines.length > DEBUG.maxLines) DEBUG.lines.shift();

  const ctx = DEBUG.ctx;
  const w = DEBUG.canvas.width;
  const h = DEBUG.canvas.height;

  // background
  //ctx.fillStyle = 'rgba(0,0,0,0.82)';
  //ctx.fillRect(0, 0, w, h);
  ctx.clearRect(0, 0, w, h);

  // text
  ctx.font = '26px monospace';
  ctx.textBaseline = 'top';
  ctx.fillStyle = 'crimson';

DEBUG.lines.reverse();
  DEBUG.lines.forEach((line, i) => {
    ctx.fillText(line, 14, 12 + i * 28);
  });
DEBUG.lines.reverse();

  DEBUG.texture.needsUpdate = true;
}

// ---------- usage ----------
createDebugConsole(suica.camera,{worldWidth:10,worldHeight:5});          // call once after scene is ready

//debugLog('Debug console ready');
//debugLog('Three revision:', THREE.REVISION);

// later, inside your click / select handler:
//debugLog('select', 123);
//debugLog('model pos', 'abc');
</script>


</body>
</html>
